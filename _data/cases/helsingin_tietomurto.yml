# Helsingin tietomurto 2024 — JULKINEN JULKAISUDATA
# Älä lisää keskeneräisiä väitteitä, henkilötietoja tai työmuistiinpanoja.
# Varsinaiset lähteet ja tapahtumat lisätään vasta tarkistuksen jälkeen.
status: "Valmistelussa"
started: "2026-11-08"
changes: []

timeline:
  - id: "tapahtuma-2025-12-10-toimenpideselvitys"
    date: "2025-12-10"
    category: "Korjaustoimet"
    title: "Valtuusto sai selvityksen arvioinnin jälkeisistä korjaustoimista"
    summary: "Helsingin kaupunginvaltuusto merkitsi tiedoksi selvityksen vuoden 2024 arviointikertomuksen johdosta tehdyistä toimenpiteistä. Kaupunki raportoi muun muassa tietoturvan johtamisen uudistamisesta, vanhentuneiden ratkaisujen korjaamisesta, tietosuojakäytäntöjen kehittämisestä ja teknisen valvontakyvyn vahvistamisesta. Päätös dokumentoi kaupungin raportoiman toimeenpanon, mutta ei itsessään osoita kaikkien toimien valmistumista tai niiden vaikuttavuutta."
    source_ids:
      - "H017"
      - "H018"
    attribution: "Toimenpiteiden toteutumisastetta koskevat tiedot perustuvat Helsingin kaupungin valtuustolle antamaan omaan seurantaraportointiin."

  - id: "tapahtuma-2025-08-25-korjaustoimien-tilannekatsaus"
    date: "2025-08-25"
    category: "Korjaustoimet"
    title: "Kaupunginhallitus käsitteli tietoturvajohtamisen muutoshankkeen etenemistä"
    summary: "Kaupunginhallitus merkitsi tiedoksi tietomurron jälkeen käynnistetyn tietoturvajohtamisen muutoshankkeen tilannekatsauksen. Kansliapäällikön 16.5.2025 käynnistämään hankkeeseen oli koottu tietoturvan johtamisen ja organisoinnin uudistaminen, palveluiden jatkuvuudenhallinta sekä tekniset korjaustoimet ja investoinnit yhteensä 13 työkokonaisuudeksi. Katsaus oli kaupungin oma seurantaraportti eikä riippumaton arvio korjausten vaikuttavuudesta."
    source_ids:
      - "H016"
    attribution: "Hankkeen etenemistä ja korjaustoimien tilaa koskevat tiedot ovat kaupunginhallitukselle annetusta Helsingin kaupungin omasta tilannekatsauksesta."

  - id: "tapahtuma-2025-06-18-vastuuvapaus"
    date: "2025-06-18"
    category: "Päätökset ja vastuut"
    title: "Valtuusto jätti vastuuvapauden myöntämättä viidelle tilivelvolliselle"
    summary: "Helsingin kaupunginvaltuusto hyväksyi vuoden 2024 tilinpäätöksen ja myönsi vastuuvapauden muille tilivelvollisille, mutta ei strategiajohtajalle, digitalisaatiojohtajalle, kasvatuksen ja koulutuksen toimialajohtajalle, yhteisten palvelujen johtajalle eikä tietohallintojohtajalle. Päätös seurasi tilintarkastajan muistutusta ja keskeneräistä rikostutkintaa. Vastuuvapauden myöntämättä jättäminen ei merkitse rikosoikeudellisen syyllisyyden tai vahingonkorvausvastuun toteamista."
    source_ids:
      - "H015"

  - id: "tapahtuma-2025-06-17-turvallisuustutkinta-valmistui"
    date: "2025-06-17"
    category: "Selvitykset ja arvioinnit"
    title: "Riippumaton turvallisuustutkinta valmistui ja antoi neljä suositusta"
    summary: "Onnettomuustutkintakeskuksen yhteydessä toiminut riippumaton tutkintaryhmä julkaisi tutkintaselostuksensa. Tutkinnan mukaan tietomurron laajuuteen vaikuttivat puutteellisesti ylläpidetty VPN-etäyhteyspalvelin, verkkovalvonnan puutteet, epäselvät ylläpitovastuut ja verkkolevylle kertynyt suuri tietomäärä. Hyökkääjän arvioitiin saaneen noin 750 000 asiakirjaa ja noin kaksi teratavua tietoa. Tutkinta antoi neljä valtakunnallista turvallisuussuositusta."
    source_ids:
      - "H001"
      - "H019"

  - id: "tapahtuma-2025-04-29-tilintarkastusmuistutus"
    date: "2025-04-29"
    category: "Päätökset ja vastuut"
    title: "Tilintarkastaja teki muistutuksen ja rajasi vastuuvapaussuositustaan"
    summary: "Helsingin kaupungin vuoden 2024 tilintarkastuskertomuksessa tehtiin kuntalain 125 §:n mukainen muistutus, koska hallinnon lainmukaiseen hoitamiseen sekä sisäisen valvonnan ja riskienhallinnan järjestämiseen liittyi merkittävä epävarmuus, jota KRP:n esitutkinta osaltaan selvitti. Tilintarkastaja ei puoltanut vastuuvapautta viidelle johtavalle tilivelvolliselle, koska esitutkinta oli kesken ja vastuunjako epäselvä. Muistutus ei ole rikosoikeudellinen syyllisyysratkaisu."
    source_ids:
      - "H014"
      - "H015"

  - id: "tapahtuma-2025-04-25-tarkastuslautakunnan-arviointi"
    date: "2025-04-25"
    category: "Selvitykset ja arvioinnit"
    title: "Tarkastuslautakunnan arviointi tunnisti tietoturvan rakenteellisia puutteita"
    summary: "Helsingin tarkastuslautakunnan arvioinnissa tietomurron katsottiin tuoneen esiin puutteita tietoturvakontrolleissa, ylläpidon vastuissa ja tiedon säilyttämisen käytännöissä. Arvioinnissa korostettiin tietoturvan ja tiedonhallinnan johtamisen sekä vastuiden selkeyttämistä, asianmukaisen tietosuojatason varmistamista ja digitaalisen kehitysvelan korjaamista. Arviointi muodosti myöhemmän valtuustoseurannan ja korjaustoimia koskevan raportoinnin perustan."
    source_ids:
      - "H013"

  - id: "tapahtuma-2025-03-13-tietosuojarikos-esitutkinta"
    date: "2025-03-13"
    category: "Rikostutkinta ja oikeusprosessi"
    title: "KRP käynnisti esitutkinnan epäillystä tietosuojarikoksesta kaupungin toiminnassa"
    summary: "Keskusrikospoliisi ilmoitti käynnistäneensä tietomurtoon liittyvän erillisen esitutkinnan Helsingin kaupungin toiminnasta. Tutkinnan rikosnimikkeenä oli epäilty tietosuojarikos, ja tarkoituksena oli selvittää, liittyikö henkilötietojen suojaamiseen tahallisuutta tai törkeää huolimattomuutta sekä miten vastuut olivat jakautuneet. Poliisi ei tuolloin nimennyt rikoksesta epäiltyjä henkilöitä. Esitutkinnan aloittaminen ei osoita rikoksen tapahtuneen."
    source_ids:
      - "H012"
      - "H020"

  - id: "tapahtuma-2024-12-16-kaupunginhallituksen-tilannekatsaus"
    date: "2024-12-16"
    category: "Päätökset ja vastuut"
    title: "Kaupunginhallitus edellytti tietoturvan korjausohjelman nopeaa toimeenpanoa"
    summary: "Helsingin kaupunginhallitus merkitsi tietomurtoa koskevan tilannekatsauksen tiedoksi, määräsi uuden etenemiskatsauksen tuotavaksi viimeistään elokuussa 2025 ja piti välttämättömänä tiedonhallinnan, tietoturvan ja henkilötietojen suojan toimenpideohjelman nopeaa toteuttamista. Kaupunginhallitus edellytti lisäksi kaupunginkanslialta ja toimialoilta muita tarvittavia toimia vahvan tietoturvan varmistamiseksi."
    source_ids:
      - "H011"

  - id: "tapahtuma-2024-07-08-selvitys-tietosuojavaltuutetulle"
    date: "2024-07-08"
    category: "Viranomaisvalvonta"
    title: "Helsinki toimitti tietosuojavaltuutetulle tarkennetun selvityksen"
    summary: "Helsinki toimitti tietosuojavaltuutetun toimistolle tarkennetun selvityksen tietomurron kohteena olleella verkkolevyllä käsitellyistä henkilötiedoista. Kaupunki korosti, että taulukko kuvasi verkkolevyllä käsiteltyjä tietoja eikä osoittanut, mitkä yksittäiset tiedot hyökkääjä oli kopioinut. Mahdollisesti tietomurron piiriin kuuluvien oppijoiden määrää tarkennettiin tässä vaiheessa noin 96 700 henkilöön heidän huoltajiensa lisäksi."
    source_ids:
      - "H010"
      - "H021"

  - id: "tapahtuma-2024-07-04-poikkeuksellisen-tapahtuman-tutkinta"
    date: "2024-07-04"
    category: "Selvitykset ja arvioinnit"
    title: "Valtioneuvosto päätti riippumattomasta turvallisuustutkinnasta"
    summary: "Valtioneuvosto päätti käynnistää Helsingin tietomurrosta turvallisuustutkintalain mukaisen poikkeuksellisen tapahtuman tutkinnan ja asetti tutkintaryhmän Onnettomuustutkintakeskuksen yhteyteen. Tutkinnan tavoitteena oli selvittää tapahtumakulku, taustatekijät, viranomaisten ja muiden toimijoiden toiminta sekä turvallisuuden parantamiseksi tarvittavat toimet, ei ratkaista rikos- tai vahingonkorvausvastuuta."
    source_ids:
      - "H009"

  - id: "tapahtuma-2024-06-18-tilannepaivitys"
    date: "2024-06-18"
    category: "Viestintä ja ilmoitukset"
    title: "Helsinki ilmoitti ettei uusia kohderyhmiä tai väärinkäytöksiä ollut tiedossa"
    summary: "Helsinki kertoi, ettei tietomurron ollut havaittu laajentuneen aiemmin ilmoitettuihin kohderyhmiin nähden eikä tietojen väärinkäytöstä ollut tuolloin kaupungin tiedossa näyttöä. Kaupunki kertoi myös verkkolevyn palauttamisesta käyttöön hallitusti sekä tietoturvan ja tietosuojan johtamisen ja koulutuksen vahvistamisesta. Ilmaus väärinkäytösten puuttumisesta kuvasi tiedon tilaa kyseisenä päivänä, ei myöhempää tai lopullista varmuutta."
    source_ids:
      - "H008"
      - "H022"
    attribution: "Tietojen väärinkäytöstä ei ollut 18.6.2024 Helsingin kaupungin mukaan tiedossa havaintoja."

  - id: "tapahtuma-2024-05-21-kohderyhmat-laajenivat"
    date: "2024-05-21"
    category: "Viestintä ja ilmoitukset"
    title: "Mahdollisesti vaarantuneiden henkilöryhmien arvio laajeni merkittävästi"
    summary: "Helsinki kertoi tietomurron mahdollisesti koskevan noin 150 000 oppijaa huoltajineen sekä koko noin 38 000 henkilön henkilöstöä. Mahdollisiin kohderyhmiin lisättiin muun muassa yksityisten päiväkotien ja oppilaitosten asiakkaita, kotiopetuksessa olevia, Stadin ammatti- ja aikuisopiston opiskelijoita sekä Santahaminan toimipisteisiin liittyviä henkilöitä. Arvio kuvasi mahdollista altistumista eikä todistanut kaikkien ryhmiin kuuluvien tietojen kopiointia."
    source_ids:
      - "H007"
      - "H023"

  - id: "tapahtuma-2024-05-17-krp-yhteistutkinta"
    date: "2024-05-17"
    category: "Rikostutkinta ja oikeusprosessi"
    title: "KRP ja Helsingin poliisi jatkoivat tietomurron tutkintaa yhdessä"
    summary: "Keskusrikospoliisi ja Helsingin poliisi ilmoittivat tutkivansa kaupungin järjestelmiin kohdistunutta tapausta yhteistyössä törkeänä tietomurtona. Julkisuuteen kerrottiin myös, että KRP selvitti kaupungin toimintaa siitä näkökulmasta, miten tietomurto oli päässyt tapahtumaan. Kyse oli tutkintatoimesta eikä tuolloin vielä kaupungin tai yksittäisten henkilöiden rikosvastuuta koskevasta epäilystä."
    source_ids:
      - "H006"
      - "H001"

  - id: "tapahtuma-2024-05-14-tietosuojavalvonta"
    date: "2024-05-14"
    category: "Viranomaisvalvonta"
    title: "Tietosuojavaltuutetun toimisto ilmoitti tutkivansa tietoturvaloukkausta"
    summary: "Tietosuojavaltuutetun toimisto ilmoitti selvittävänsä Helsingin henkilötietojen tietoturvaloukkausta ja tutkivansa muun muassa sitä, oliko kaupunki huolehtinut tietosuojavaatimuksista ja riittävistä suojatoimista. Helsinki oli ilmoittanut loukkauksesta valvontaviranomaiselle 30.4. Toimisto oli ohjannut kaupunkia tiedottamaan rekisteröityjä ja pyysi kaupungilta lisäselvityksen. Selvityksen käynnistyminen ei ollut päätös siitä, että Helsinki olisi rikkonut tietosuojalainsäädäntöä."
    source_ids:
      - "H005"

  - id: "tapahtuma-2024-05-13-poliisi-tiedottaa"
    date: "2024-05-13"
    category: "Rikostutkinta ja oikeusprosessi"
    title: "Poliisi kertoi tutkivansa tapausta törkeänä tietomurtona"
    summary: "Helsingin poliisi kertoi julkisesti tutkivansa kaupungin tietoverkkoon kohdistunutta tapausta törkeänä tietomurtona. Varhaisessa poliisiviestinnässä tapahtuma kuvattiin kaupungin tietoon 30.4. tulleen tilanteen kautta. Myöhempi tekninen turvallisuustutkinta osoitti hyökkääjän päässeen sisäverkkoon jo 25.4. ja aloittaneen tiedon kopioinnin ennen 30.4. tehtyä havaintoa."
    source_ids:
      - "H004"
      - "H001"

  - id: "tapahtuma-2024-05-13-laajuus-tarkentui"
    date: "2024-05-13"
    category: "Viestintä ja ilmoitukset"
    title: "Helsinki kertoi henkilötunnusten ja osoitetietojen vaarantuneen"
    summary: "Helsinki ilmoitti selvitysten osoittaneen, että hyökkääjä oli saanut kaupungin koko henkilöstön käyttäjätunnuksia ja sähköpostiosoitteita sekä kasvatuksen ja koulutuksen toimialan oppijoiden, huoltajien ja henkilöstön henkilötunnuksia ja osoitetietoja. Kaupunki arvioi tuolloin pahimman tapauksen koskevan yli 80 000 oppijaa huoltajineen. Samalla se korosti, ettei vielä voitu määrittää kaikkia hyökkääjälle päätyneitä tietoja."
    source_ids:
      - "H003"
      - "H024"

  - id: "tapahtuma-2024-05-02-ensimmainen-julkinen-tiedote"
    date: "2024-05-02"
    category: "Viestintä ja ilmoitukset"
    title: "Helsinki kertoi tietomurrosta ensimmäisen kerran julkisesti"
    summary: "Helsinki tiedotti kasvatuksen ja koulutuksen toimialaan kohdistuneesta tietomurrosta ensimmäisen kerran 2.5.2024. Kaupungin tuolloisen tiedon mukaan hyökkääjä oli saanut haltuunsa oppijoiden ja henkilöstön käyttäjätunnuksia ja sähköpostiosoitteita. Kaupunki kertoi tehneensä teknisiä suojaustoimia sekä ilmoitukset tietosuojavaltuutetulle, Traficomin Kyberturvallisuuskeskukselle ja poliisille. Tapahtuman todellinen laajuus tarkentui myöhemmin olennaisesti."
    source_ids:
      - "H002"
      - "H025"

  - id: "tapahtuma-2024-04-30-havaitseminen"
    date: "2024-04-30"
    category: "Tietomurron kulku"
    title: "Helsinki havaitsi tietomurron ja pysäytti hyökkääjän toiminnan"
    summary: "Hyökkääjän viimeinen tutkinnassa tunnistettu suuri tiedonsiirto päättyi 30.4. aamulla. Samana päivänä Helsinki havaitsi poikkeavan toiminnan, varmisti tietomurron ja käynnisti tekniset hallinta- ja suojaustoimet, joiden seurauksena hyökkääjän toiminta verkossa saatiin pysäytettyä. Kaupunki ilmoitti tapauksesta tietosuojavaltuutetun toimistolle ja oli yhteydessä poliisiin sekä Traficomin Kyberturvallisuuskeskukseen."
    source_ids:
      - "H001"
      - "H005"
      - "H003"

  - id: "tapahtuma-2024-04-26-tietojen-kopiointi"
    date: "2024-04-26"
    category: "Tietomurron kulku"
    title: "Hyökkääjä aloitti tietojen siirtämisen kaupungin verkosta"
    summary: "Turvallisuustutkinnan teknisen aikajanan mukaan hyökkääjä teki 26.4. ensimmäisen noin 1,03 gigatavun testiluonteisen tiedonsiirron kaupungin verkosta. Seuraavana päivänä alkoi huomattavasti suurempi tiedon kopiointi kolmesta palvelinvirrasta. Kaikkiaan hyökkääjän arvioitiin siirtäneen neljässä erässä noin kaksi teratavua tietoa ennen kuin toiminta havaittiin 30.4."
    source_ids:
      - "H001"

  - id: "tapahtuma-2024-04-25-sisaverkkoon-paasy"
    date: "2024-04-25"
    category: "Tietomurron kulku"
    title: "Hyökkääjä pääsi sisäverkkoon ja laajensi käyttöoikeuksiaan"
    summary: "Turvallisuustutkinnan mukaan hyökkääjä pääsi 25.4. kasvatuksen ja koulutuksen sisäverkkoon käyttäen verkosta aiemmin vuotaneita oppilastunnuksia ja haavoittuvaa etäyhteysratkaisua. Palomuuri ja haittaohjelmatorjunta tuottivat tapahtuman aikana hälytyksiä, mutta niihin ei reagoitu siten, että hyökkäys olisi katkennut. Hyökkääjä eteni palvelimille ja sai haltuunsa myös hallinnollisia tunnuksia."
    source_ids:
      - "H001"

  - id: "tapahtuma-2024-04-14-vpn-hyodyntamisyritykset"
    date: "2024-04-14"
    category: "Tietomurron kulku"
    title: "Haavoittuvaan VPN-palvelimeen kohdistui hyödyntämisyrityksiä"
    summary: "Turvallisuustutkinnan teknisen rekonstruktion mukaan vanhentuneeseen VPN-etäyhteyspalvelimeen kohdistui 14.4. hyödyntämisyrityksiä, joiden yhteydessä laite kaatui. Tutkinnan perusteella hyökkääjä ei tässä vaiheessa vielä saanut pääsyä kaupungin sisäverkkoon. Tapahtuma on kuitenkin olennainen myöhemmän murtautumisen esivaihe, koska sama puutteellisesti ylläpidetty etäyhteysratkaisu muodostui myöhemmin hyökkäysreitiksi."
    source_ids:
      - "H001"

